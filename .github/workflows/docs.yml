name: Deploy MkDocs

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: |
          pip install mkdocs mkdocs-material

      - run: |
          cd shorts-doc
          mkdocs build
      - name: Check sitemap
        run: |
          echo "===== sitemap.xml ====="
          cat shorts-doc/site/sitemap.xml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: shorts-doc/site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4